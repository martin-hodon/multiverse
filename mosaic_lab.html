<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mosaic lab</title>
<style>html, body { margin: 0; background: #1b1d21; color: #d8d4cc; font: 12px ui-monospace, monospace; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1500" height="900"></canvas>
<script type="module">
// A bench for the mosaics (mosaic/*.js, docs/mosaic.md), no three.js. Each pattern: two repeats, a crop at 3x nearest, the drawing beneath it,
// its mips at 1/4, 1/8, 1/16 in linear light, and a floor at a grazing angle.
//   ?name=a,b &seeds=1,2,3 (or a count: each pattern at each seed) &plain=1 (the picture only, for sheets of seeds) &cell=340 &crop=150 &cx=.5 &cy=.5 &w=1500 &res=512 (the array's, each of a tile's `across` layers) &palette=name
// window.__metrics, per pattern: the laying's numbers and
//   seam    the step across the tile's edge against the strongest 5% of steps in the tile (under 1.3)
//   drift   mean colour difference from the drawing at 1/16 (under 8: sRGB units, all three channels; under 12 where `mix` or `gleam` means it)
//   moire   the strongest periodic beat of row and column means in mips 1/4 to 1/16, against the drawing's own (under 1.5)
//   hash    of the pixels: drawn twice, must agree
//   beats   (&beats=1) where the moire's beat lies
//   fails   the gates this one misses, also printed beside its name
import { registerPatterns, renderPattern, patternOf } from "./patterns.js";
import { measures, lab } from "./mosaic.js";
import "./ornament.js";
import "./medieval.js";
import { registerGreek } from "./greek.js";

const Q = new URLSearchParams(location.search), get = async (p) => (await fetch(p)).json();
const doc = await get("assets/patterns/mosaic.json");
registerPatterns({ palettes: await get("assets/patterns/palettes.json"), ornament: await get("assets/patterns/ornament.json"), mosaic: doc });
registerGreek({ canon: await get("assets/greek/canon.json") });
lab.keep = true;
const seedsQ = Q.get("seeds"), seeds = !seedsQ ? [null] : seedsQ.includes(",") ? seedsQ.split(",").map(Number) : Array.from({ length: +seedsQ }, (_, i) => i + 1), plain = Q.has("plain");
const names = (Q.get("name") ?? Object.keys(doc.patterns).filter((k) => doc.patterns[k].layers[0].kind === "mosaic").join(",")).split(",").flatMap((n) => seeds.map((s) => [n, s])), cell = +(Q.get("cell") ?? 300), crop = +(Q.get("crop") ?? 150);
const W = +(Q.get("w") ?? 1500), rowH = plain ? cell + 18 : cell + 118, stepX = plain ? cell + 6 : cell + crop + 150, cols = Math.max(1, Math.floor(W / stepX));
const cv = document.getElementById("c");
cv.width = W; cv.height = Math.ceil(names.length / cols) * rowH + 8;
const g = cv.getContext("2d", { willReadFrequently: true });
g.fillStyle = "#1b1d21"; g.fillRect(0, 0, cv.width, cv.height);
const lin = (v) => { v /= 255; return v <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }, srgb = (v) => 255 * (v <= .0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - .055);
const boxTo = ({ d, w: W, h: H }, w, h) => { const o = new Float32Array(w * h * 3), fx = W / w, fy = H / h; for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const y0 = Math.floor(y * fy), y1 = Math.max(y0 + 1, Math.floor((y + 1) * fy)), x0 = Math.floor(x * fx), x1 = Math.max(x0 + 1, Math.floor((x + 1) * fx)); let n = 0; for (let Y = y0; Y < y1; Y++) for (let X = x0; X < x1; X++) { for (let c = 0; c < 3; c++) o[(y * w + x) * 3 + c] += d[(Y * W + X) * 3 + c]; n++; } for (let c = 0; c < 3; c++) o[(y * w + x) * 3 + c] /= n; } return { d: o, w, h }; };   // (a drawing not at twice the tile's texels: to them, as the stones are painted)
const down = ({ d, w, h }) => { const W2 = w >> 1, H2 = h >> 1, o = new Float32Array(W2 * H2 * 3); for (let y = 0; y < H2; y++) for (let x = 0; x < W2; x++) for (let c = 0; c < 3; c++) o[(y * W2 + x) * 3 + c] = (d[(y * 2 * w + x * 2) * 3 + c] + d[(y * 2 * w + x * 2 + 1) * 3 + c] + d[((y * 2 + 1) * w + x * 2) * 3 + c] + d[((y * 2 + 1) * w + x * 2 + 1) * 3 + c]) / 4; return { d: o, w: W2, h: H2 }; };
const linear = (rgba, w, h) => { const d = new Float32Array(w * h * 3); for (let i = 0; i < w * h; i++) for (let c = 0; c < 3; c++) d[i * 3 + c] = lin(rgba[i * 4 + c]); return { d, w, h }; };
const chain = (m, n) => { const out = [m]; for (let i = 0; i < n && out.at(-1).w > 2 && out.at(-1).h > 2; i++) out.push(down(out.at(-1))); return out; };
const put = (m, X, Y, S) => { const c = new OffscreenCanvas(m.w, m.h), img = new ImageData(m.w, m.h); for (let i = 0; i < m.w * m.h; i++) { for (let q = 0; q < 3; q++) img.data[i * 4 + q] = srgb(m.d[i * 3 + q]); img.data[i * 4 + 3] = 255; } c.getContext("2d").putImageData(img, 0, 0); g.imageSmoothingEnabled = false; g.drawImage(c, X, Y, m.w * S, m.h * S); };
// (the strongest beat in the row means and column means: a discrete Fourier sum, not counting the lowest two)
const beat = (m) => { const peak = (N, M, at) => { const s = new Float32Array(N); for (let i = 0; i < N; i++) { let a = 0; for (let j = 0; j < M; j++) a += at(i, j); s[i] = a / M; } let best = 0; for (let f = 2; f < N / 2; f++) { let re = 0, im = 0; for (let i = 0; i < N; i++) { re += s[i] * Math.cos(6.283 * f * i / N); im += s[i] * Math.sin(6.283 * f * i / N); } best = Math.max(best, Math.hypot(re, im) / N); } return best; }; return Math.max(peak(m.h, m.w, (i, j) => m.d[(i * m.w + j) * 3 + 1]), peak(m.w, m.h, (i, j) => m.d[(j * m.w + i) * 3 + 1])); };
// (&beats=1: at each mip, where the strongest beat is, in the laying and in the drawing: [level, w, h, axis, cycles, amount] twice over)
const peakOf = (m) => { let out = [0, 0, 0]; const scan = (axis, N, M, at) => { const v = new Float32Array(N); for (let i = 0; i < N; i++) { let a = 0; for (let j = 0; j < M; j++) a += at(i, j); v[i] = a / M; } for (let f = 2; f < N / 2; f++) { let re = 0, im = 0; for (let i = 0; i < N; i++) { re += v[i] * Math.cos(6.283 * f * i / N); im += v[i] * Math.sin(6.283 * f * i / N); } const b = Math.hypot(re, im) / N; if (b > out[2]) out = [axis, f, +b.toFixed(5)]; } }; scan("y", m.h, m.w, (i, j) => m.d[(i * m.w + j) * 3 + 1]); scan("x", m.w, m.h, (i, j) => m.d[(j * m.w + i) * 3 + 1]); return out; };
const metrics = {};
const shoot = (name, def, ref, x, y) => {
  const t0 = performance.now(), t = renderPattern(def, { res: Q.has("res") ? +Q.get("res") * (def.across ?? 1) : def.res ?? 512, palette: Q.get("palette") ?? undefined }), ms = Math.round(performance.now() - t0);
  const [w, h] = t.px, rep = def.repeat !== false, k = (rep ? cell / 2 : cell) / Math.max(w, h);
  g.save(); g.beginPath(); g.rect(x, y + 14, cell, cell); g.clip();
  if (rep) { const f = g.createPattern(t.canvas, "repeat"); f.setTransform(new DOMMatrix([k, 0, 0, k, x, y + 14])); g.fillStyle = f; g.fillRect(x, y + 14, cell, cell); }
  else g.drawImage(t.canvas, x, y + 14, w * k, h * k);
  g.restore();
  const px = t.canvas.getContext("2d").getImageData(0, 0, w, h).data, s = measures(def.layers[0]);
  if (plain) { let hash = 2166136261; for (let i = 0; i < px.length; i += 4) hash = Math.imul(hash ^ px[i] ^ (px[i + 1] << 8), 16777619); return { ms, px: t.px, ...s, source: undefined, hash: hash >>> 0, fails: [s.pitchPx < 3 && "pitch", s.grout > .3 && "grout"].filter(Boolean) }; }
  g.imageSmoothingEnabled = false; const cw = Math.min(w, Math.floor(crop / 3)), cx = Math.max(0, Math.floor(+(Q.get("cx") ?? .5) * w - cw / 2)), cy = Math.max(0, Math.floor(+(Q.get("cy") ?? .5) * h - cw / 2));
  g.drawImage(t.canvas, cx, cy, cw, cw, x + cell + 4, y + 14, crop, crop);
  const m = { ms, px: t.px, ...s }; delete m.source;
  const diff = (a, b, horiz) => { let q = 0, n = horiz ? h : w; for (let i = 0; i < n; i++) { const A = (horiz ? i * w + a : a * w + i) * 4, B = (horiz ? i * w + b : b * w + i) * 4; q += Math.abs(px[A] - px[B]) + Math.abs(px[A + 1] - px[B + 1]) + Math.abs(px[A + 2] - px[B + 2]); } return q / n / 3; };
  // (against the strongest steps anywhere in the tile: a joint or a drawn edge may lie on the seam, as on any other line)
  const usual = (horiz) => { const N = horiz ? w : h, v = []; for (let a = 0; a + 1 < N; a++) v.push(diff(a, a + 1, horiz)); v.sort((p, q) => p - q); return Math.max(1, v[Math.floor(N * .95)]); };
  if (rep) m.seam = [diff(w - 1, 0, true) / usual(true), diff(h - 1, 0, false) / usual(false)].map((v) => +v.toFixed(2));
  const chainM = chain(linear(px, w, h), 4);
  put(chainM[2], x + cell + 4, y + 14 + crop + 2, 1); put(chainM[3], x + cell + 4 + chainM[2].w + 4, y + 14 + crop + 2, 1); put(chainM[4] ?? chainM.at(-1), x + cell + 4 + chainM[2].w + chainM[3].w + 8, y + 14 + crop + 2, 1);
  if (s.source) {
    const S = s.source, cs = new OffscreenCanvas(S.W, S.H); cs.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(S.rgba), S.W, S.H), 0, 0);
    g.imageSmoothingEnabled = true; g.drawImage(cs, x + cell + crop + 8, y + 14, 130, 130 * S.H / S.W);
    let src = linear(S.rgba, S.W, S.H); src = S.W === w * 2 && S.H === h * 2 ? chain(src, 1)[1] : boxTo(src, w, h); const cS = chain(src, 4), far = chainM[Math.min(4, chainM.length - 1)], farS = cS[Math.min(4, cS.length - 1)];
    let e = 0, dark = 0; for (let i = 0; i < Math.min(far.d.length, farS.d.length); i += 3) { for (let c = 0; c < 3; c++) { const a = srgb(far.d[i + c]), b = srgb(farS.d[i + c]); e += Math.abs(a - b) / 3; dark += (a - b) / 3; } }
    m.drift = +(e / (far.d.length / 3)).toFixed(1); m.darker = +(dark / (far.d.length / 3)).toFixed(1);
    m.moire = +Math.max(...[2, 3, 4].filter((q) => chainM[q] && cS[q]).map((q) => beat(chainM[q]) / Math.max(.004, beat(cS[q])))).toFixed(2);
    if (Q.has("beats")) { const rows = (q) => { const o = []; for (let i = 0; i < q.h; i++) { let v = 0; for (let j = 0; j < q.w; j++) v += q.d[(i * q.w + j) * 3 + 1]; o.push(+(v / q.w).toFixed(3)); } return o; }; m.rowsLaid = rows(chainM[4]); m.rowsDrawn = rows(cS[4]); }
    if (Q.has("beats")) m.beats = [2, 3, 4].filter((q) => chainM[q] && cS[q]).map((q) => [q, chainM[q].w, chainM[q].h, ...peakOf(chainM[q]), ...peakOf(cS[q])]);
  }
  // a floor at a grazing angle: each screen row samples the mip its distance asks for, across and along alike
  const fw = cell, fh = 90, f = new ImageData(fw, fh), hor = 2, world = 8;
  for (let r = 0; r < fh; r++) {
    const depth = 1 / (1 - r / fh * .98 + .02), z = depth, lvl = Math.max(0, Math.min(chainM.length - 1, Math.ceil(Math.log2(z * world * w / fw) + 1))), mm = chainM[lvl];
    for (let c = 0; c < fw; c++) { const u = ((c / fw - .5) * z * world % 1 + 1) % 1, v = (z * world * .5 % 1 + 1) % 1, i = (Math.floor(v * mm.h) * mm.w + Math.floor(u * mm.w)) * 3; for (let q = 0; q < 3; q++) f.data[(r * fw + c) * 4 + q] = srgb(mm.d[i + q]); f.data[(r * fw + c) * 4 + 3] = 255; }
  }
  const cf = new OffscreenCanvas(fw, fh); cf.getContext("2d").putImageData(f, 0, 0); g.drawImage(cf, x, y + 14 + cell + 2);
  let hash = 2166136261; for (let i = 0; i < px.length; i += 4) hash = Math.imul(hash ^ px[i] ^ (px[i + 1] << 8), 16777619); m.hash = hash >>> 0;
  m.fails = [(m.seam ?? [0]).some((v) => v > 1.3) && "seam", m.moire > 1.5 && "moire", m.drift > (def.layers[0].gleam || def.layers[0].mix ? 12 : 8) && "drift", m.pitchPx < 3 && "pitch", m.grout > .3 && "grout"].filter(Boolean);
  g.fillStyle = "#e27a6a"; g.fillText(m.fails.join(" "), x + 150, y + 10);
  return m;
};
names.forEach(([name, seed], i) => {
  const x = 6 + (i % cols) * stepX, y = 6 + Math.floor(i / cols) * rowH, ref = `mosaic/${name}`, def0 = patternOf(ref), id = seed === null ? name : `${name}#${seed}`;
  const over = Q.has("plan") ? JSON.parse(Q.get("plan")) : null, def = { ...def0, layers: def0.layers.map((L) => ({ ...L, ...(seed === null ? null : { seed }), ...(over ? { plan: { ...L.plan, ...over } } : null) })) };   // (&plan={...}: try a plan's values without generating)
  g.fillStyle = "#d8d4cc"; g.fillText(id, x, y + 10);
  try { metrics[id] = shoot(id, def, ref, x, y); }
  catch (e) { metrics[id] = String(e.stack ?? e).slice(0, 400); g.fillStyle = "#e27a6a"; g.fillText(String(e.message).slice(0, 50), x, y + 40); }
});
window.__metrics = metrics; window.__ready = true;
</script>
</body>
</html>
