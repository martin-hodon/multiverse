<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass lab</title>
<style>html, body { margin: 0; background: #0b0b0d; color: #d8d4cc; font: 12px ui-monospace, monospace; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1500" height="900"></canvas>
<script type="module">
// A bench for the glass (glass.js, docs/glass.md), no three.js. Each window as the tile lit from behind, and beside it its panes in false colour.
//   ?name=a,b &seeds=1,2,3 (or a count: &seeds=6, each a window of its own) &cell=340 &cw=(a column's width, for tall windows) &w=1500 &res=512 &palette=name &panes=1 &cut=0 (leave out the cuts: the pieces' own leads)
// window.__metrics, per pattern: panes, cuts, slivers, bridges; the gates: open (lead ends that go nowhere) 0, tiny (panes too small to cut) 0,
// gap (share of the opening with no pane) under .004; hash of the pixels: drawn twice, must agree.
import { registerPatterns, renderPattern, patternOf, paletteOf } from "./patterns.js";
import { measures, lab, renderGlass } from "./glass.js";

const Q = new URLSearchParams(location.search), get = async (p) => (await fetch(p)).json();
lab.keep = true;
const doc = await get("assets/patterns/glass.json");
registerPatterns({ palettes: await get("assets/patterns/palettes.json"), glass: doc });
const seedQ = Q.get("seeds"), seeds = seedQ ? (seedQ.includes(",") ? seedQ.split(",").map(Number) : Array.from({ length: +seedQ }, (_, i) => i + 1)) : [null];
const names = (Q.get("name") ?? Object.keys(doc.patterns).join(",")).split(",").flatMap((n) => seeds.map((s) => s === null ? [n, n, null] : [`${n}#${s}`, n, s])), cell = +(Q.get("cell") ?? 340), showPanes = Q.get("panes") !== "0";
const W = +(Q.get("w") ?? 1500), span = Q.get("cw") ? +Q.get("cw") : showPanes ? cell * 1.5 + 12 : cell + 8, cols = Math.max(1, Math.floor(W / span)), rowH = cell + 24;
const cv = document.getElementById("c"); cv.width = W; cv.height = Math.ceil(names.length / cols) * rowH + 8;
const g = cv.getContext("2d", { willReadFrequently: true }); g.fillStyle = "#0b0b0d"; g.fillRect(0, 0, W, cv.height);
const metrics = {};
names.forEach(([name, base, seed], i) => {
  const x = 6 + (i % cols) * span, y = 6 + Math.floor(i / cols) * rowH, def0 = patternOf(`glass/${base}`), L = { ...def0.layers[0], ...(seed !== null ? { seed } : null) }, def = { ...def0, layers: [L] }, ref = def;
  if (Q.get("cut") === "0") { L.maxPane = 1e9; L.depth = 1e9; L.maxAspect = 1e9; }
  g.fillStyle = "#d8d4cc"; g.fillText(name, x, y + 10);
  try {
    const t0 = performance.now(), t = renderPattern(ref, { res: +(Q.get("res") ?? def.res ?? 512), palette: Q.get("palette") ?? undefined }), ms = Math.round(performance.now() - t0), [w, h] = t.px, k = cell / Math.max(w, h), s = measures(L);
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high"; if (L.lie) { g.save(); g.translate(x + h * k, y + 14); g.rotate(Math.PI / 2); g.drawImage(t.canvas, 0, 0, w * k, h * k); g.restore(); } else g.drawImage(t.canvas, x, y + 14, w * k, h * k);   // (a lying window stood back up)
    if (showPanes && s.results) {
      const U = L.lie ? [def.size[1], def.size[0]] : def.size, z = cell / 2 / Math.max(...U), X = (p) => x + cell + 6 + (p[0] + U[0] / 2) * z, Y = (p) => y + 14 + (U[1] / 2 - p[1]) * z; let n = 0;
      for (const R of s.results) for (const p of R.panes) { g.fillStyle = `hsl(${n++ * 137.5 % 360} 60% ${p.whole ? 80 : 50}%)`; g.beginPath(); p.pts.forEach((q, j) => j ? g.lineTo(X(q), Y(q)) : g.moveTo(X(q), Y(q))); g.closePath(); g.fill(); }
    }
    const px = t.canvas.getContext("2d").getImageData(0, 0, w, h).data; let hash = 2166136261; for (let j = 0; j < px.length; j += 4) hash = Math.imul(hash ^ px[j] ^ (px[j + 1] << 8), 16777619);
    if (!s) throw new Error("no numbers from the window: the gates can't pass on nothing");
    const m = { ms, px: t.px, ...s, hash: hash >>> 0 }; delete m.results; metrics[name] = m;
    // (?twice=1: drawn again past the cache, by a new canvas: it must come out the same)
    let twice = true; if (Q.get("twice")) { lab.fresh = true; const b = renderGlass(L, { tile: def.size, px: t.px, pal: paletteOf(def, Q.get("palette") ?? undefined) }); lab.fresh = false; const d = b.getContext("2d").getImageData(0, 0, w, h).data; let again = 2166136261; for (let j = 0; j < d.length; j += 4) again = Math.imul(again ^ d[j] ^ (d[j + 1] << 8), 16777619); twice = (again >>> 0) === (hash >>> 0); m.again = again >>> 0; }
    m.fails = [m.open > 0 && "open", m.tiny > 0 && "tiny", m.gap > .004 && "gap", !twice && "twice"].filter(Boolean); g.fillStyle = "#e27a6a"; g.fillText(m.fails.join(" "), x + 150, y + 10);
  } catch (e) { metrics[name] = String(e.stack ?? e).slice(0, 500); g.fillStyle = "#e27a6a"; g.fillText(String(e.message).slice(0, 50), x, y + 40); }
});
window.__metrics = metrics; window.__ready = true;
</script>
</body>
</html>
