  pitch: (p) => { if (p !== undefined) pitch = p; return pitch; },
  PIPE, setPipe, FRAME, setFps, FRINGE, profile,   // profile(): where the frame's CPU time goes, printed after a second   // setFps(90) changes the budget the readout judges against; setFps("max") uncaps the loop

  wanderers, pathRoutes, waterSD, dryKeep, putDown, WLEVEL, waterY, riders,   // (checks: swimmers' depth, dry tracks, goods riding the barge)
  tracks, tracksDraw, renderer,   // the between-ticks drawing (see simTicks)
  // A GPU bench, from the console: renders the CURRENT view n times back to back and waits for the GPU
  // (no swap between them, so the answer is GPU work per frame, not the 16.7ms vsync interval), with the
  // named herds' meshes left out. __dbg.bench() - __dbg.bench(30, ["life"]) is what drawing the villagers
  // costs from where you stand -- point it at a group behind a house, then at one in the open, and the two
  // differences are the wasted share and the useful one. Names: __dbg.combatNames().map(([n]) => n)
  bench: async (n = 30, hide = []) => {
    // WebGPU has no gl.finish(): the wait is for the device's own submitted work, which is the same barrier
    const off = combatNames().filter(([nm]) => hide.includes(nm)).map(([, h]) => h.mesh).filter(Boolean);
    const done = () => renderer.backend?.device?.queue?.onSubmittedWorkDone?.() ?? Promise.resolve();
    for (const m of off) m.visible = false;
    renderer.render(scene, camera); await done();   // warm up: shaders, uploads, the first sync
    const t0 = performance.now();
    for (let i = 0; i < n; i++) renderer.render(scene, camera);
    await done();
    const ms = (performance.now() - t0) / n;
    for (const m of off) m.visible = true;
    return +ms.toFixed(2);
  },
  get squirrels() { return squirrels; }, mirrors: () => mirrorSet, paintings: () => ({ count: paintingSet.count, pictures: paintingSet.pictures.length, views: paintingViews, frames: paintingSet.frames, mesh: paintingSet.mesh, atlas: paintingSet.atlas }), get env() { return env; },
  placeAt: (x, y, z) => { camera.position.x = x; camera.position.z = z; standY = y; camera.position.y = y + eyeH; airborne = false; },   // (checks: stand on a given floor)
  get life() { return life; }, get lifeHerd() { return lifeHerd; },   // the villagers: census(), bell(hour), places
  // why is this spot "under a roof"? (the weather curtains hide there): floors overhead, roofed footprints
  whyRoofed: (x, z, y) => ({ floors: floorsAt(x, z).map((h, i) => [i, +h.toFixed(2)]).filter(([, h]) => h > y + .3),
    sites: sites.filter((s) => !roofless(s) && Math.abs(x - s.x) < BUILDINGS[s.key].footprint[0] / 2 && Math.abs(z - siteZ(s)) < BUILDINGS[s.key].footprint[1] / 2)
                .map((s) => [s.key, s.x, siteZ(s), BUILDINGS[s.key].footprint]) }),
  place: (x, z) => { camera.position.x = x; camera.position.z = z; standY = terrainY(x, z); airborne = false; },
  // where a building stands (checks: aim at a landmark by its key)
  siteOf: (key) => { const s = sites.find((q) => q.key === key); return s ? { x: s.x, z: siteZ(s), footprint: BUILDINGS[s.key].footprint } : null; },
  state: () => ({ mounted: mounted?.def.name ?? null, flying: !!mounted?.flying, standY, y: mounted?.w.p.y,
                  wingT: mounted?.wingT, animT: mounted?.animT }) }, Object.getOwnPropertyDescriptors(window.__dbg ?? {}));   // (the probe's hooks kept, getters and all)
// (after every herd exists: silencing them here catches the lot -- animals, villagers, guards, riders, the
// fisherman, the pairs under a yoke -- without a switch at each call site)
if (FIGURES !== "1") for (const [, h] of combatNames()) {
  if (FIGURES === "0") { h.update = () => {}; if (h.mesh) h.mesh.visible = false; }
  else {
    // still: keep posing while the world places everybody -- the wanderers, the villagers' routines and the
    // carts all set their positions over the first few frames -- and only then freeze. Freezing on frame one
    // (which is what this did) left every figure stacked wherever it was born, which is both wrong and the
    // worst case the renderer can be handed: a pile of the most expensive shader in the world, all overlapping.
    const u = h.update;
    // ...and the villagers are placed by their routines on a SIMULATION tick, not a frame, so wait for one of
    // those too. Freeze too early and every villager stands at the origin: 144 of the most expensive shader in
    // the world in one pile, which is both the wrong picture and the worst case a GPU can be handed.
    h.update = (t) => { if (stirred < 6 || simTick < 2) u.call(h, t); };
  }
}
bootMark("__ready");
window.__ready = true;
</script>
